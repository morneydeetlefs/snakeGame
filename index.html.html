<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guerrilla Snake: Plant Seeds!</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #111;
      overflow: hidden;
      font-family: monospace;
      color: lime;
    }
    #container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      box-sizing: border-box;
    }
    canvas {
      border: 2px solid lime;
      background: #222;
      aspect-ratio: 1 / 1;
      width: min(95vw, 70vh);
      height: min(95vw, 70vh);
      max-width: 95vw;
      max-height: 70vh;
      display: block;
      object-fit: none;
      touch-action: none;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: clamp(1.4em, 4vw, 1.8em);
      text-align: center;
    }
    p, #status {
      margin: 4px 0;
      text-align: center;
      font-size: clamp(0.85em, 3vw, 1em);
    }
    #version {
      font-size: 0.8em;
      color: #555;
      margin-top: 8px;
      text-align: center;
    }
    #startOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: lime;
      font-size: clamp(1.2em, 5vw, 1.6em);
      text-align: center;
      z-index: 100;
      padding: 20px;
      box-sizing: border-box;
    }
    #startOverlay h2 {
      margin: 0 0 20px;
      font-size: 1.4em;
    }
    #startOverlay p {
      margin: 0 0 30px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>🪴 Guerrilla Snake</h1>
    <p>Plants: <span id="score">0</span> | High: <span id="highScore">0</span> | Speed: <span id="speedLevel">1</span>/8</p>
    <canvas id="game"></canvas>
    <p>💡 Swipe/arrows: Grow vine! Faster as you grow longer!</p>
    <div id="version">Version: 1.6 – Stationary start + popup + finer grid + length-based speed (2026-02)</div>
  </div>

  <div id="startOverlay">
    <h2>🪴 Ready to Plant?</h2>
    <p>Swipe or tap a direction to start growing your urban vine!</p>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('highScore');
    const speedEl = document.getElementById('speedLevel');
    const overlay = document.getElementById('startOverlay');

    let grid;
    const GRID_SIZE = 40; // Finer grid: smaller cells, more precise

    let audioCtx = null;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playBeep(frequency, duration = 0.1, type = 'sine') {
      if (!audioCtx) return;
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.frequency.value = frequency;
      oscillator.type = type;
      gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + duration);
    }

    function resizeCanvas() {
      const maxSize = Math.min(
        window.innerWidth * 0.92,
        window.innerHeight * 0.68
      );
      canvas.width = maxSize;
      canvas.height = maxSize;
      grid = maxSize / GRID_SIZE;
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resizeCanvas, 100);
    });
    window.addEventListener('orientationchange', resizeCanvas);
    window.addEventListener('load', () => {
      setTimeout(resizeCanvas, 50);
      setTimeout(resizeCanvas, 300);
    });
    resizeCanvas();

    let count = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('guerrillaSnakeHigh') || '0');
    highEl.textContent = highScore;

    // Game state
    let gameStarted = false;

    // Center start position
    const startX = Math.floor(GRID_SIZE / 2);
    const startY = Math.floor(GRID_SIZE / 2);
    let snakeHeadX = startX;
    let snakeHeadY = startY;
    let snakeDX = 0; // Stationary start
    let snakeDY = 0;
    const snake = { cells: [{x: startX, y: startY}], maxCells: 1 }; // Start with 1 cell

    const seed = { x: 0, y: 0 };

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function getNewSeed() {
      seed.x = getRandomInt(0, GRID_SIZE);
      seed.y = getRandomInt(0, GRID_SIZE);
      let valid = false;
      while (!valid) {
        valid = true;
        for (let cell of snake.cells) {
          if (seed.x === cell.x && seed.y === cell.y) {
            valid = false;
            seed.x = getRandomInt(0, GRID_SIZE);
            seed.y = getRandomInt(0, GRID_SIZE);
            break;
          }
        }
      }
    }
    getNewSeed();

    function toPixel(x, y) {
      return { px: x * grid, py: y * grid };
    }

    // Speed based on snake length (slower start, faster as grows)
    function getSpeedLevel() {
      return Math.min(8, Math.floor((snake.maxCells - 1) / 2) + 1);
    }

    function getSpeedDelay() {
      const level = getSpeedLevel();
      return Math.max(3, 12 - level); // Start slow (delay=11 at len=1), max fast (delay=3 at high len)
    }

    function updateSpeedDisplay() {
      speedEl.textContent = getSpeedLevel();
    }

    // Input handlers - start game on first input
    function handleDirection(dx, dy) {
      if (!gameStarted) {
        gameStarted = true;
        overlay.style.display = 'none';
        snakeDX = dx;
        snakeDY = dy;
        playBeep(600, 0.2); // Start sound
        updateSpeedDisplay();
        return;
      }
      // Prevent reverse direction
      if ((dx === -snakeDX && dy === -snakeDY) || (dx === 0 && dy === 0)) return;
      snakeDX = dx;
      snakeDY = dy;
    }

    // Touch
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      if (!audioCtx) initAudio();
      e.preventDefault();
      touchStartX = e.touches[0].screenX;
      touchStartY = e.touches[0].screenY;
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      const deltaY = e.changedTouches[0].screenY - touchStartY;
      const threshold = 40;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > threshold) {
        handleDirection(deltaX > 0 ? 1 : -1, 0);
      } else if (Math.abs(deltaY) > threshold) {
        handleDirection(0, deltaY > 0 ? 1 : -1);
      }
    }, { passive: false });

    // Keyboard
    document.addEventListener('keydown', e => {
      if (!audioCtx) initAudio();
      if (e.key === 'ArrowLeft') handleDirection(-1, 0);
      else if (e.key === 'ArrowUp') handleDirection(0, -1);
      else if (e.key === 'ArrowRight') handleDirection(1, 0);
      else if (e.key === 'ArrowDown') handleDirection(0, 1);
    });

    function loop() {
      requestAnimationFrame(loop);

      // Only update if game started and moving
      if (!gameStarted || (snakeDX === 0 && snakeDY === 0)) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Draw stationary snake head
        ctx.fillStyle = 'lime';
        const headPos = toPixel(snakeHeadX, snakeHeadY);
        ctx.fillRect(headPos.px, headPos.py, grid - 1, grid - 1);
        return;
      }

      const delay = getSpeedDelay();
      if (++count < delay) return;
      count = 0;

      // Move
      snakeHeadX += snakeDX;
      snakeHeadY += snakeDY;

      if (snakeHeadX < 0) snakeHeadX = GRID_SIZE - 1;
      else if (snakeHeadX >= GRID_SIZE) snakeHeadX = 0;
      if (snakeHeadY < 0) snakeHeadY = GRID_SIZE - 1;
      else if (snakeHeadY >= GRID_SIZE) snakeHeadY = 0;

      // Eat
      if (snakeHeadX === seed.x && snakeHeadY === seed.y) {
        snake.maxCells++;
        score++;
        scoreEl.textContent = score;
        updateSpeedDisplay();
        getNewSeed();
        playBeep(800, 0.12);
      }

      snake.cells.unshift({ x: snakeHeadX, y: snakeHeadY });
      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      // Collision check
      let gameOver = false;
      for (let i = 0; i < snake.cells.length; i++) {
        const cell = snake.cells[i];
        for (let j = i + 1; j < snake.cells.length; j++) {
          if (cell.x === snake.cells[j].x && cell.y === snake.cells[j].y) {
            gameOver = true;
            break;
          }
        }
        if (gameOver) break;
      }

      // Draw
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Seed
      const seedPos = toPixel(seed.x, seed.y);
      ctx.fillStyle = 'gold';
      ctx.fillRect(seedPos.px, seedPos.py, grid - 1, grid - 1);

      // Snake
      ctx.fillStyle = 'lime';
      snake.cells.forEach(cell => {
        const pos = toPixel(cell.x, cell.y);
        ctx.fillRect(pos.px, pos.py, grid - 1, grid - 1);
      });

      // Game over
      if (gameOver) {
        playBeep(200, 0.3, 'square');
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('guerrillaSnakeHigh', highScore);
          highEl.textContent = highScore;
          playBeep(1000, 0.15);
        }
        // Reset to stationary
        gameStarted = false;
        overlay.style.display = 'flex';
        snakeHeadX = startX;
        snakeHeadY = startY;
        snake.cells = [{x: startX, y: startY}];
        snake.maxCells = 1;
        snakeDX = 0;
        snakeDY = 0;
        score = 0;
        scoreEl.textContent = score;
        updateSpeedDisplay();
        getNewSeed();
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
