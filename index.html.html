<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guerrilla Snake: Plant Seeds!</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 10px;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      color: lime;
    }
    canvas {
      border: 2px solid lime;
      background: #222;
      max-width: 95vw;
      max-height: 70vh;
      touch-action: none;
    }
    h1 {
      margin: 10px 0;
      font-size: 1.5em;
      text-align: center;
    }
    p {
      margin: 5px 0;
      text-align: center;
    }
    #version {
      font-size: 0.9em;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🪴 Guerrilla Snake</h1>
  <p>Plants Planted: <span id="score">0</span> | Speed Level: <span id="speedLevel">1</span>/5</p>
  <canvas id="game"></canvas>
  <p>💡 Urban vine: Grow without getting caught! Faster every 5 plants!</p>
  <div id="version">Version: 1.3 – Added progressive speed control (2026-02)</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speedLevel');

    // Declare grid early
    let grid;

    // Responsive grid: Fit to screen (25x25 cells)
    const updateCanvasSize = () => {
      const size = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.6);
      canvas.width = size;
      canvas.height = size;
      grid = size / 25;
    };
    updateCanvasSize();
    window.addEventListener('resize', updateCanvasSize);

    let count = 0;
    let score = 0;

    // Use integer grid indices (0-24) for snake/seed to avoid float precision issues
    const GRID_SIZE = 25; // 25x25 grid
    let snakeHeadX = 12; // Integer index
    let snakeHeadY = 12;
    let snakeDX = 1;     // Direction in grid steps
    let snakeDY = 0;
    const snake = {
      cells: [],           // Array of {x: int, y: int}
      maxCells: 4
    };

    const seed = { x: 0, y: 0 }; // Integer indices

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function getNewSeed() {
      seed.x = getRandomInt(0, GRID_SIZE);
      seed.y = getRandomInt(0, GRID_SIZE);
      // Avoid spawning on snake (simple check)
      let valid = false;
      while (!valid) {
        valid = true;
        for (let cell of snake.cells) {
          if (seed.x === cell.x && seed.y === cell.y) {
            valid = false;
            seed.x = getRandomInt(0, GRID_SIZE);
            seed.y = getRandomInt(0, GRID_SIZE);
            break;
          }
        }
      }
    }
    getNewSeed();

    // Convert index to pixel position
    function toPixel(x, y) {
      return { px: x * grid, py: y * grid };
    }

    // Get current speed level and delay (1-5 levels, faster = lower delay)
    function getSpeedLevel() {
      return Math.min(5, Math.floor(score / 5) + 1);
    }

    function getSpeedDelay() {
      const level = getSpeedLevel();
      return Math.max(1, 5 - level); // Level 1: delay=4, Level 5: delay=1 (fastest)
    }

    // Touch swipe controls (direction in grid steps)
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      const deltaY = e.changedTouches[0].screenY - touchStartY;
      const threshold = 30;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > threshold) {
        if (deltaX > 0 && snakeDX === 0) { snakeDX = 1; snakeDY = 0; } // Right
        else if (deltaX < 0 && snakeDX === 0) { snakeDX = -1; snakeDY = 0; } // Left
      } else if (Math.abs(deltaY) > threshold) {
        if (deltaY > 0 && snakeDY === 0) { snakeDY = 1; snakeDX = 0; } // Down
        else if (deltaY < 0 && snakeDY === 0) { snakeDY = -1; snakeDX = 0; } // Up
      }
    }, { passive: false });

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.which === 37 && snakeDX === 0) { snakeDX = -1; snakeDY = 0; } // Left
      else if (e.which === 38 && snakeDY === 0) { snakeDY = -1; snakeDX = 0; } // Up
      else if (e.which === 39 && snakeDX === 0) { snakeDX = 1; snakeDY = 0; } // Right
      else if (e.which === 40 && snakeDY === 0) { snakeDY = 1; snakeDX = 0; } // Down
    });

    function updateSpeedDisplay() {
      const level = getSpeedLevel();
      speedEl.textContent = level;
    }

    function loop() {
      requestAnimationFrame(loop);

      // Dynamic speed control
      const delay = getSpeedDelay();
      if (++count < delay) return;
      count = 0;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Move head in grid indices
      snakeHeadX += snakeDX;
      snakeHeadY += snakeDY;

      //
