<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guerrilla Snake: Plant Seeds!</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #111;
      overflow: hidden;
      font-family: monospace;
      color: lime;
    }
    #container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }
    canvas {
      border: 2px solid lime;
      background: #222;
      width: 100%;
      max-width: 95vw;
      height: auto;
      max-height: 65vh;
      display: block;
      touch-action: none;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 1.6em;
      text-align: center;
    }
    p, #status {
      margin: 4px 0;
      text-align: center;
      font-size: 0.95em;
    }
    #version {
      font-size: 0.8em;
      color: #555;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>🪴 Guerrilla Snake</h1>
    <p>Plants Planted: <span id="score">0</span> | Speed Level: <span id="speedLevel">1</span>/5</p>
    <canvas id="game"></canvas>
    <p>💡 Swipe or arrows to grow your urban vine!</p>
    <div id="version">Version: 1.3.1 – Improved canvas sizing & loading (2026-02)</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speedLevel');

    let grid;
    const GRID_SIZE = 25;

    // Force resize on load + better sizing logic
    function resizeCanvas() {
      // Use the smaller dimension to keep square
      const size = Math.min(
        window.innerWidth * 0.92,
        window.innerHeight * 0.65
      );
      canvas.width = size;
      canvas.height = size;
      grid = size / GRID_SIZE;

      // Redraw immediately after resize
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Call resize multiple times to catch initial load issues
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      setTimeout(resizeCanvas, 100);   // small delay helps on mobile
      setTimeout(resizeCanvas, 500);
    });
    // Run once immediately
    resizeCanvas();

    let count = 0;
    let score = 0;

    let snakeHeadX = 12;
    let snakeHeadY = 12;
    let snakeDX = 1;
    let snakeDY = 0;
    const snake = {
      cells: [],
      maxCells: 4
    };

    const seed = { x: 0, y: 0 };

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function getNewSeed() {
      seed.x = getRandomInt(0, GRID_SIZE);
      seed.y = getRandomInt(0, GRID_SIZE);
      let valid = false;
      while (!valid) {
        valid = true;
        for (let cell of snake.cells) {
          if (seed.x === cell.x && seed.y === cell.y) {
            valid = false;
            seed.x = getRandomInt(0, GRID_SIZE);
            seed.y = getRandomInt(0, GRID_SIZE);
            break;
          }
        }
      }
    }
    getNewSeed();

    function toPixel(x, y) {
      return { px: x * grid, py: y * grid };
    }

    // Speed control
    function getSpeedLevel() {
      return Math.min(5, Math.floor(score / 5) + 1);
    }

    function getSpeedDelay() {
      const level = getSpeedLevel();
      return 6 - level; // 5 → 1 frame delay (slower to faster)
    }

    function updateSpeedDisplay() {
      speedEl.textContent = getSpeedLevel();
    }

    // Touch controls
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touchStartX = e.touches[0].screenX;
      touchStartY = e.touches[0].screenY;
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      const deltaY = e.changedTouches[0].screenY - touchStartY;
      const threshold = 40;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > threshold) {
        if (deltaX > 0 && snakeDX === 0) { snakeDX = 1; snakeDY = 0; }
        else if (deltaX < 0 && snakeDX === 0) { snakeDX = -1; snakeDY = 0; }
      } else if (Math.abs(deltaY) > threshold) {
        if (deltaY > 0 && snakeDY === 0) { snakeDY = 1; snakeDX = 0; }
        else if (deltaY < 0 && snakeDY === 0) { snakeDY = -1; snakeDX = 0; }
      }
    }, { passive: false });

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' && snakeDX === 0) { snakeDX = -1; snakeDY = 0; }
      else if (e.key === 'ArrowUp'   && snakeDY === 0) { snakeDY = -1; snakeDX = 0; }
      else if (e.key === 'ArrowRight'&& snakeDX === 0) { snakeDX = 1; snakeDY = 0; }
      else if (e.key === 'ArrowDown' && snakeDY === 0) { snakeDY = 1; snakeDX = 0; }
    });

    function loop() {
      requestAnimationFrame(loop);

      const delay = getSpeedDelay();
      if (++count < delay) return;
      count = 0;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      snakeHeadX += snakeDX;
      snakeHeadY += snakeDY;

      if (snakeHeadX < 0) snakeHeadX = GRID_SIZE - 1;
      else if (snakeHeadX >= GRID_SIZE) snakeHeadX = 0;
      if (snakeHeadY < 0) snakeHeadY = GRID_SIZE - 1;
      else if (snakeHeadY >= GRID_SIZE) snakeHeadY = 0;

      if (snakeHeadX === seed.x && snakeHeadY === seed.y) {
        snake.maxCells++;
        score++;
        scoreEl.textContent = score;
        updateSpeedDisplay();
        getNewSeed();
      }

      snake.cells.unshift({ x: snakeHeadX, y: snakeHeadY });

      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      const seedPos = toPixel(seed.x, seed.y);
      ctx.fillStyle = 'gold';
      ctx.fillRect(seedPos.px, seedPos.py, grid - 1, grid - 1);

      ctx.fillStyle = 'lime';
      snake.cells.forEach((cell, index) => {
        const pos = toPixel(cell.x, cell.y);
        ctx.fillRect(pos.px, pos.py, grid - 1, grid - 1);

        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            snakeHeadX = 12;
            snakeHeadY = 12;
            snake.cells = [];
            snake.maxCells = 4;
            snakeDX = 1;
            snakeDY = 0;
            score = 0;
            scoreEl.textContent = score;
            updateSpeedDisplay();
            getNewSeed();
            return;
          }
        }
      });
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
